<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GameHarbor</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
    <header>
        <a href="../../index.html" class="logo">GAME<span>HARBOR</span></a>
        <nav>
            <ul>
                <li><a href="../../index.html">Tienda</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-box">
            <h2>Crear Cuenta en GameHarbor</h2>
            <form action="RegisterServlet" method="POST">
                <div class="input-group">
                    <label for="txtNombre">Nombre Completo</label>
                    <input type="text" id="txtNombre" name="txtNombre" required placeholder="Ej. Ricardo Tantarico">
                </div>
                <div class="input-group">
                    <label for="txtCorreo">Correo Electrónico</label>
                    <input type="email" id="txtCorreo" name="txtCorreo" required placeholder="correo@ejemplo.com">
                </div>
                <div class="input-group">
                    <label for="txtPassword">Contraseña</label>
                    <input type="password" id="txtPassword" name="txtPassword" required placeholder="********">
                </div>
                <button type="submit" class="btn-steam" style="width: 100%; margin-top: 10px;">Registrarse</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                ¿Ya tienes una cuenta? <a href="login.html" style="color: var(--steam-blue);">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GameHarbor. Soluciones Web y Aplicaciones Distribuidas - UPN.</p>
    </footer>
    <script src="../../js/main.js"></script>
</body>
</html>
