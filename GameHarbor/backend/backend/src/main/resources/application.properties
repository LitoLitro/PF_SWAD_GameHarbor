spring.application.name=gameharbor-backend
server.port=8080
spring.profiles.default=local

# ---- SQL Server ----
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GameHarbor;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- JPA: el esquema lo manejan los scripts de /database, Hibernate NO lo toca ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# El secreto debe tener al menos 32 caracteres. En produccion/Azure usar variable de entorno.
app.jwt.secret=${JWT_SECRET:gameharbor-dev-secret-cambiar-en-produccion-0123456789}
app.jwt.expiration-minutes=120

# ---- CORS (frontend Angular en desarrollo) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
