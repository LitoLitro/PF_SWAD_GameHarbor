# Configurar DB_URL con encrypt=true y trustServerCertificate=false.
# Sin valores predeterminados para evitar arrancar producción con credenciales locales.
app.jwt.secret=${JWT_SECRET}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.encrypt=true
spring.datasource.hikari.data-source-properties.trustServerCertificate=false
